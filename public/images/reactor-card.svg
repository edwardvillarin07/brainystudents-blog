<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a23"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#00b894"/>
    </linearGradient>
    <linearGradient id="r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#a29bfe"/>
    </linearGradient>
    <radialGradient id="pulse-glow">
      <stop offset="0%" style="stop-color:#00d4aa; stop-opacity:0.2"/>
      <stop offset="50%" style="stop-color:#00d4aa; stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#00d4aa; stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="core-glow">
      <stop offset="0%" style="stop-color:#a29bfe; stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#a29bfe; stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes pulse-border {
        0%, 100% { opacity: 0.25; stroke-width: 1.5; }
        50% { opacity: 0.7; stroke-width: 2.5; }
      }
      @keyframes border-dash {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 300; }
      }
      @keyframes float-title {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes spin-ring {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spin-ring-reverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes pulse-core {
        0%, 100% { r: 6; opacity: 0.9; }
        50% { r: 10; opacity: 0.5; }
      }
      @keyframes glow-pulse {
        0%, 100% { opacity: 0; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      @keyframes glow-pulse-bg {
        0%, 100% { r: 60; opacity: 0; }
        50% { r: 80; opacity: 1; }
      }
      @keyframes orbit-particle {
        0% { transform: rotate(0deg) translateX(45px) rotate(0deg); opacity: 0.8; }
        50% { opacity: 1; }
        100% { transform: rotate(360deg) translateX(45px) rotate(-360deg); opacity: 0.8; }
      }
      @keyframes orbit-particle-reverse {
        0% { transform: rotate(0deg) translateX(30px) rotate(0deg); opacity: 0.6; }
        50% { opacity: 0.9; }
        100% { transform: rotate(-360deg) translateX(30px) rotate(360deg); opacity: 0.6; }
      }
      @keyframes blink {
        0%, 100% { opacity: 0.6; transform: scaleY(1); }
        50% { opacity: 0.15; transform: scaleY(0.5); }
      }
      @keyframes letter-float {
        0%, 100% { transform: translateY(0); }
        25% { transform: translateY(-3px); }
        50% { transform: translateY(0); }
        75% { transform: translateY(2px); }
      }
      .pulse { animation: pulse-border 3s ease-in-out infinite; }
      .border-dash { stroke-dasharray: 15 40; animation: border-dash 5s linear infinite; }
      .ring-outer { transform-origin: 300px 230px; animation: spin-ring 10s linear infinite; }
      .ring-inner { transform-origin: 300px 230px; animation: spin-ring-reverse 7s linear infinite; }
      .core { animation: pulse-core 2.5s ease-in-out infinite; transform-origin: 300px 230px; }
      .glow-ring { transform-origin: 300px 230px; animation: glow-pulse 2.5s ease-in-out infinite; }
      .glow-bg { transform-origin: 300px 230px; animation: glow-pulse-bg 2.5s ease-in-out infinite; }
      .particle1 { transform-origin: 300px 230px; animation: orbit-particle 6s linear infinite; }
      .particle2 { transform-origin: 300px 230px; animation: orbit-particle 6s linear infinite 2s; }
      .particle3 { transform-origin: 300px 230px; animation: orbit-particle 6s linear infinite 4s; }
      .particle4 { transform-origin: 300px 230px; animation: orbit-particle-reverse 5s linear infinite 1s; }
      .particle5 { transform-origin: 300px 230px; animation: orbit-particle-reverse 5s linear infinite 3.5s; }

    </style>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="40" y="40" width="520" height="320" rx="12" fill="none" stroke="url(#accent)" stroke-width="1.5" class="pulse"/>
  <rect x="40" y="40" width="520" height="320" rx="12" fill="none" stroke="url(#accent)" stroke-width="0.8" class="border-dash"/>

  <g filter="url(#glow)">
    <text x="300" y="110" font-family="monospace" font-size="56" fill="url(#r)" text-anchor="middle" font-weight="bold">REACTOR</text>
  </g>

  <text x="300" y="148" font-family="monospace" font-size="16" fill="#8892b0" text-anchor="middle" letter-spacing="1">CVE-2025-55182 · React2Shell</text>

  <circle cx="300" cy="230" r="70" fill="url(#pulse-glow)" class="glow-bg"/>

  <g class="ring-outer">
    <circle cx="300" cy="230" r="50" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.25" stroke-dasharray="4 8"/>
  </g>
  <g class="ring-inner">
    <circle cx="300" cy="230" r="35" fill="none" stroke="url(#r)" stroke-width="1.2" opacity="0.35" stroke-dasharray="3 7"/>
  </g>

  <circle cx="300" cy="230" r="16" fill="url(#core-glow)"/>
  <circle cx="300" cy="230" r="6" fill="url(#accent)" class="core" filter="url(#glow)"/>

  <circle cx="300" cy="230" r="2" fill="#a29bfe" class="particle1"/>
  <circle cx="300" cy="230" r="2" fill="#a29bfe" class="particle2"/>
  <circle cx="300" cy="230" r="2" fill="#a29bfe" class="particle3"/>
  <circle cx="300" cy="230" r="1.5" fill="#00d4aa" class="particle4"/>
  <circle cx="300" cy="230" r="1.5" fill="#00d4aa" class="particle5"/>

  <text x="300" y="325" font-family="monospace" font-size="13" fill="#00d4aa" text-anchor="middle" letter-spacing="2">HACKTHEBOX — PRIVILEGE ESCALATION</text>

  <rect x="220" y="347" width="6" height="6" rx="1.5" fill="#00d4aa" opacity="0.6"/>
  <rect x="238" y="347" width="6" height="6" rx="1.5" fill="#00d4aa" opacity="0.6"/>
  <rect x="256" y="347" width="6" height="6" rx="1.5" fill="#00d4aa" opacity="0.6"/>
  <rect x="320" y="347" width="6" height="6" rx="1.5" fill="#00d4aa" opacity="0.6"/>
  <rect x="338" y="347" width="6" height="6" rx="1.5" fill="#00d4aa" opacity="0.6"/>
  <rect x="356" y="347" width="6" height="6" rx="1.5" fill="#00d4aa" opacity="0.6"/>
</svg>
