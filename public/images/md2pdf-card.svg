<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes pulse-border {
        0%, 100% { opacity: 0.25; stroke-width: 1.5; }
        50% { opacity: 0.7; stroke-width: 2.5; }
      }
      @keyframes border-dash {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 300; }
      }
      @keyframes typewriter {
        0% { clip-path: inset(0 100% 0 0); }
        40% { clip-path: inset(0 0 0 0); }
        60% { clip-path: inset(0 0 0 0); }
        100% { clip-path: inset(0 0 0 0); }
      }
      @keyframes iframe-pulse {
        0%, 100% { stroke: #e94560; opacity: 0.4; }
        33% { stroke: #ff6b6b; opacity: 0.8; }
        66% { stroke: #e94560; opacity: 0.5; }
      }
      @keyframes blink {
        0%, 100% { opacity: 0.6; transform: scaleY(1); }
        50% { opacity: 0.2; transform: scaleY(0.6); }
      }
      .pulse { animation: pulse-border 3s ease-in-out infinite; }
      .border-dash { stroke-dasharray: 20 40; animation: border-dash 4s linear infinite; }
      .type { animation: typewriter 6s ease-in-out infinite; }
      .iframe-anim { animation: iframe-pulse 3s ease-in-out infinite; }

    </style>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="40" y="40" width="520" height="320" rx="12" fill="none" stroke="url(#accent)" stroke-width="1.5" class="pulse"/>
  <rect x="40" y="40" width="520" height="320" rx="12" fill="none" stroke="url(#accent)" stroke-width="1" class="border-dash"/>

  <text x="300" y="115" font-family="monospace" font-size="64" fill="url(#accent)" text-anchor="middle" font-weight="bold" filter="url(#glow)">MD2PDF</text>

  <g class="type">
    <text x="300" y="155" font-family="monospace" font-size="18" fill="#8892b0" text-anchor="middle">&lt;SSRF /&gt;</text>
  </g>

  <rect x="170" y="190" width="260" height="55" rx="6" fill="none" class="iframe-anim" stroke-width="1.5"/>
  <rect x="170" y="190" width="260" height="55" rx="6" fill="#e94560" opacity="0.05"/>
  <text x="300" y="224" font-family="monospace" font-size="15" fill="#e94560" text-anchor="middle" font-weight="bold">iframe injection</text>

  <rect x="220" y="260" width="160" height="4" rx="2" fill="#e94560" opacity="0.15"/>
  <rect x="230" y="260" width="60" height="4" rx="2" fill="#e94560" opacity="0.3"/>

  <text x="300" y="320" font-family="monospace" font-size="13" fill="#64ffda" text-anchor="middle" letter-spacing="2">TRYHACKME — WEB EXPLOITATION</text>

  <rect x="220" y="345" width="6" height="6" rx="1.5" fill="#64ffda" opacity="0.6"/>
  <rect x="238" y="345" width="6" height="6" rx="1.5" fill="#64ffda" opacity="0.6"/>
  <rect x="256" y="345" width="6" height="6" rx="1.5" fill="#64ffda" opacity="0.6"/>
  <rect x="320" y="345" width="6" height="6" rx="1.5" fill="#64ffda" opacity="0.6"/>
  <rect x="338" y="345" width="6" height="6" rx="1.5" fill="#64ffda" opacity="0.6"/>
  <rect x="356" y="345" width="6" height="6" rx="1.5" fill="#64ffda" opacity="0.6"/>
</svg>
